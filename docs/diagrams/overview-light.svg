<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="title-overview desc-overview">
<title id="title-overview">Three projects, three architectures</title>
<desc id="desc-overview">Left: the CLI Music Player, a terminal process that drives a native audio process over stdin and stdout. Middle: Athena, a sandboxed Electron renderer that reaches an Express server only through the main process. Right: huddle., a phone app that polls a NestJS API in Docker, which stores data in MongoDB through Prisma.</desc>
