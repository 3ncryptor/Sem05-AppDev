<text class="title native" x="60" y="386">afplay (macOS)</text><text class="line" x="60" y="406">used if audio_player is missing</text></g>
<g><rect class="box client" x="436" y="140" width="328" height="64" rx="9"/>
<text class="title client" x="448" y="162">Renderer: React 19, sandboxed</text><text class="line" x="448" y="182">no Node.js, no network</text></g>
<g><rect class="box native" x="436" y="252" width="328" height="64" rx="9"/>
