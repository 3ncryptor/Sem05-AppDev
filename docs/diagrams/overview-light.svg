<text class="caption" x="48" y="470">Native code in its own process,</text><text class="caption" x="48" y="488">driven by a line protocol over pipes.</text><text class="caption" x="436" y="470">Least privilege: only the main process</text><text class="caption" x="436" y="488">reaches the network and the file system.</text><text class="caption" x="824" y="470">Client and containerised server;</text><text class="caption" x="824" y="488">polling instead of push.</text>
