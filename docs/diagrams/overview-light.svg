<g><rect class="box client" x="824" y="140" width="328" height="64" rx="9"/>
<text class="title client" x="836" y="162">Phone: Expo Go, React Native</text><text class="line" x="836" y="182">stores, polling, Inspector</text></g>
<g><rect class="box server" x="824" y="252" width="328" height="64" rx="9"/>
