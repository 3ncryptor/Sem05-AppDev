<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-labelledby="title-player-processes desc-player-processes">
<title id="title-player-processes">CLI Music Player processes and pipes</title>
<desc id="desc-player-processes">The terminal process (Bun or Node.js) reads keys through OpenTUI, keeps the player state and redraws every 100 ms. It sends one-line commands over stdin to a separate Objective-C process that plays audio with AVAudioPlayer and replies on stdout. If that binary is missing, macOS afplay is used instead and paused with signals.</desc>
<style>
.bg{fill:#0D1117;stroke:#30363D}
.box{stroke-width:1.4}
.box.dashed,.edge.dashed,.group.dashed{stroke-dasharray:6 5}
.group{fill:none;stroke-width:1.2}
.glabel{font:600 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#E6EDF3}
.gsub{font:400 11.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#9198A1}
.title{font:600 13.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}
.line{font:400 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;fill:#9198A1}
.heading{font:700 17px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#E6EDF3}
.caption{font:400 12.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#9198A1}
.edge{fill:none;stroke:#6E7681;stroke-width:1.5}
.elabel{font:400 11px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;fill:#E6EDF3}
.elabel-bg{fill:#0D1117;opacity:.92}
.arrow{fill:#6E7681}
.legend{font:400 11.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#9198A1}
.dot{stroke:#0D1117;stroke-width:1.5}
.box.client{fill:#14233A;stroke:#6EA0DA}.group.client{stroke:#6EA0DA}.title.client{fill:#CFE0F5}.dot.client{fill:#6EA0DA}.swatch.client{fill:#14233A;stroke:#6EA0DA}.box.network{fill:#1C2128;stroke:#8B949E}.group.network{stroke:#8B949E}.title.network{fill:#D7DDE3}.dot.network{fill:#8B949E}.swatch.network{fill:#1C2128;stroke:#8B949E}.box.server{fill:#13261A;stroke:#6FBF85}.group.server{stroke:#6FBF85}.title.server{fill:#C9EBD3}.dot.server{fill:#6FBF85}.swatch.server{fill:#13261A;stroke:#6FBF85}.box.data{fill:#2B2012;stroke:#D9A24D}.group.data{stroke:#D9A24D}.title.data{fill:#F2DDB8}.dot.data{fill:#D9A24D}.swatch.data{fill:#2B2012;stroke:#D9A24D}.box.jobs{fill:#221B33;stroke:#A895DD}.group.jobs{stroke:#A895DD}.title.jobs{fill:#E0D8F5}.dot.jobs{fill:#A895DD}.swatch.jobs{fill:#221B33;stroke:#A895DD}.box.native{fill:#2E1717;stroke:#E08A8A}.group.native{stroke:#E08A8A}.title.native{fill:#F5D3D3}.dot.native{fill:#E08A8A}.swatch.native{fill:#2E1717;stroke:#E08A8A}
@media (prefers-reduced-motion: reduce){.dot{display:none}}
</style>
<defs>
<marker id="arrow-player-processes" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0 0 L10 5 L0 10 z"/></marker>
<marker id="arrow-player-processes-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0 0 L10 5 L0 10 z"/></marker>
