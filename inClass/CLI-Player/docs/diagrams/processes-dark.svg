<path id="pp-stdin" class="edge" d="M620 400 L660 400 L660 177 L719 177" marker-end="url(#arrow-player-processes)"/>
<path id="pp-read-handle" class="edge" d="M936 224 L936 239" marker-end="url(#arrow-player-processes)"/>
<path id="pp-handle-av" class="edge" d="M936 366 L936 381" marker-end="url(#arrow-player-processes)"/>
<path id="pp-av-delegate" class="edge" d="M936 444 L936 459" marker-end="url(#arrow-player-processes)"/>
