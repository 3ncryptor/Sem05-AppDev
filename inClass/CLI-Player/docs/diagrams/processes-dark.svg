<path id="pp-fallback" class="edge dashed" d="M600 492 L600 506 L660 506 L660 690 L719 690" marker-end="url(#arrow-player-processes)"/>
<g><rect class="box client" x="48" y="130" width="270" height="78" rx="9"/>
<text class="title client" x="60" y="152">OpenTUI renderer</text><text class="line" x="60" y="172">@opentui/core 0.5</text><text class="line" x="60" y="188">keyInput emits keypress</text></g>
<g><rect class="box network" x="338" y="130" width="282" height="78" rx="9"/>
<text class="title network" x="350" y="152">Keyboard and terminal</text><text class="line" x="350" y="172">keys in, drawn frames out</text><text class="line" x="350" y="188">(ANSI terminal)</text></g>
<g><rect class="box client" x="48" y="240" width="572" height="94" rx="9"/>
<text class="title client" x="60" y="262">index.js: key router and app state</text><text class="line" x="60" y="282">Space play/pause, r restart, n next, c queue, v visualizer</text><text class="line" x="60" y="298">Tab switches pane, q or Esc quits</text><text class="line" x="60" y="314">every 100 ms: dashboard.render(state)</text></g>
<g><rect class="box client" x="48" y="366" width="270" height="110" rx="9"/>
<text class="title client" x="60" y="388">ui.js: the dashboard</text><text class="line" x="60" y="408">playlist, mixer, queue,</text><text class="line" x="60" y="424">progress, 4 visualizers</text><text class="line" x="60" y="440">drawn from player state,</text><text class="line" x="60" y="456">not from audio samples</text></g>
<g><rect class="box client" x="338" y="366" width="282" height="126" rx="9"/>
<text class="title client" x="350" y="388">songs/cliPlayer.js</text><text class="line" x="350" y="408">isPlaying, isPaused, queue,</text><text class="line" x="350" y="424">volume 0-1, rate 0.5-2.0</text><text class="line" x="350" y="440">elapsed: a 1 s timer</text><text class="line" x="350" y="456">duration: afinfo</text><text class="line" x="350" y="472">reuses one audio_player</text></g>
<g><rect class="box jobs" x="48" y="508" width="270" height="94" rx="9"/>
<text class="title jobs" x="60" y="530">Cleanup on exit</text><text class="line" x="60" y="550">q, Esc, SIGINT, SIGTERM:</text><text class="line" x="60" y="566">STOP, QUIT, then SIGKILL;</text><text class="line" x="60" y="582">killall afplay</text></g>
<g><rect class="box network" x="338" y="524" width="282" height="62" rx="9"/>
<text class="title network" x="350" y="546">afinfo (macOS)</text><text class="line" x="350" y="566">per song: length in seconds</text></g>
<g><rect class="box native" x="720" y="130" width="432" height="94" rx="9"/>
<text class="title native" x="732" y="152">stdin reader (background queue)</text><text class="line" x="732" y="172">fgets reads one line at a time and</text><text class="line" x="732" y="188">hands each command to the main queue</text><text class="line" x="732" y="204">(dispatch_async)</text></g>
<g><rect class="box native" x="720" y="240" width="432" height="126" rx="9"/>
<text class="title native" x="732" y="262">handleCommand (main queue)</text><text class="line" x="732" y="282">PLAY &lt;path&gt;   RATE &lt;r&gt;   VOLUME &lt;v&gt;</text><text class="line" x="732" y="298">PAUSE   RESUME   STOP   QUIT</text><text class="line" x="732" y="314">one AVAudioPlayer, enableRate = YES</text><text class="line" x="732" y="330">after PLAY: prints DURATION &lt;s&gt;</text><text class="line" x="732" y="346">other replies are ignored by Node</text></g>
<g><rect class="box native" x="720" y="382" width="432" height="62" rx="9"/>
<text class="title native" x="732" y="404">AVAudioPlayer -&gt; CoreAudio</text><text class="line" x="732" y="424">speed and volume change mid-track</text></g>
<g><rect class="box native" x="720" y="460" width="432" height="62" rx="9"/>
<text class="title native" x="732" y="482">PlayerDelegate</text><text class="line" x="732" y="502">track finished: prints ENDED</text></g>
<g><rect class="box network dashed" x="720" y="644" width="452" height="94" rx="9"/>
<text class="title network" x="732" y="666">Fallback: afplay (macOS), one process per song</text><text class="line" x="732" y="686">afplay -v &lt;volume&gt; -r &lt;rate&gt; &lt;file&gt;</text><text class="line" x="732" y="702">pause SIGSTOP, resume SIGCONT, stop SIGKILL</text><text class="line" x="732" y="718">volume and speed apply from the next track</text></g>

<rect class="elabel-bg" x="151.2" y="212" width="63.6" height="20" rx="4"/><text class="elabel" text-anchor="middle" x="183" y="225">keypress</text>
<rect class="elabel-bg" x="94.9" y="339" width="50.2" height="20" rx="4"/><text class="elabel" text-anchor="middle" x="120" y="352">render</text>

<rect class="elabel-bg" x="400.3" y="339" width="157.4" height="20" rx="4"/><text class="elabel" text-anchor="middle" x="479" y="352">playSong, pauseSong...</text>

<rect class="elabel-bg" x="638.25" y="280" width="43.5" height="20" rx="4"/><text class="elabel" text-anchor="middle" x="660" y="293">stdin</text>



<rect class="elabel-bg" x="654.9" y="470" width="50.2" height="20" rx="4"/><text class="elabel" text-anchor="middle" x="680" y="483">stdout</text>
