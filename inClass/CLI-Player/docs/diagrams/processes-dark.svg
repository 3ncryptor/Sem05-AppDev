<rect class="bg" x="0.5" y="0.5" width="1199" height="819" rx="16"/>
<text class="heading" x="28" y="40">CLI Music Player: two processes, one line-based protocol</text><text class="caption" x="28" y="62">The dashboard really redraws every 100 ms; that loop is slowed down here so it can be seen.</text>
<g><rect class="group client" x="28" y="80" width="612" height="540" rx="14"/>
<text class="glabel" x="42" y="101">Terminal process: Bun or Node.js</text><text class="gsub" x="42" y="118">npm start, bun run start:bun, or ./setup.sh</text></g>
<g><rect class="group native" x="700" y="80" width="472" height="540" rx="14"/>
<text class="glabel" x="714" y="101">Audio process: audio_player (Objective-C)</text><text class="gsub" x="714" y="118">built by setup.sh with clang; not in git</text></g>
<path id="pp-term" class="edge" d="M318 169 L337 169" marker-start="url(#arrow-player-processes-start)" marker-end="url(#arrow-player-processes)"/>
<path id="pp-key" class="edge" d="M183 208 L183 239" marker-end="url(#arrow-player-processes)"/>
