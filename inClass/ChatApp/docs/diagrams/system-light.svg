<animateMotion dur="3s" begin="1.2s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1;1" keyTimes="0;0.1000;1" keySplines="0.45 0 0.25 1;0 0 1 1"><mpath href="#cs-db" xlink:href="#cs-db"/></animateMotion>
<animate attributeName="opacity" dur="3s" begin="1.2s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.1000;0.1001;1"/>
</circle>
