<animateMotion dur="6s" begin="0s" repeatCount="1" fill="freeze" calcMode="spline" keyPoints="0;1;1" keyTimes="0;0.3000;1" keySplines="0.45 0 0.25 1;0 0 1 1"><mpath href="#cs-bundle" xlink:href="#cs-bundle"/></animateMotion>
