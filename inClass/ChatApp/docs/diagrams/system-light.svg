<animate attributeName="opacity" dur="3s" begin="0.2s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.3333;0.3334;1"/>
</circle>
<circle class="dot server" r="5.5" cx="0" cy="0" opacity="0">
<animateMotion dur="3s" begin="1.5s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1;1" keyTimes="0;0.3333;1" keySplines="0.45 0 0.25 1;0 0 1 1"><mpath href="#cs-reply" xlink:href="#cs-reply"/></animateMotion>
<animate attributeName="opacity" dur="3s" begin="1.5s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.3333;0.3334;1"/>
</circle>
