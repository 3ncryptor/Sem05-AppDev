<animateMotion dur="5s" begin="0.9s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1;1" keyTimes="0;0.2000;1" keySplines="0.45 0 0.25 1;0 0 1 1"><mpath href="#cs-request" xlink:href="#cs-request"/></animateMotion>
<animate attributeName="opacity" dur="5s" begin="0.9s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.2000;0.2001;1"/>
</circle>
<circle class="dot server" r="5.5" cx="0" cy="0" opacity="0">
<animateMotion dur="5s" begin="2.2s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1;1" keyTimes="0;0.2000;1" keySplines="0.45 0 0.25 1;0 0 1 1"><mpath href="#cs-reply" xlink:href="#cs-reply"/></animateMotion>
<animate attributeName="opacity" dur="5s" begin="2.2s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.2000;0.2001;1"/>
</circle>
<circle class="dot client" r="5.5" cx="0" cy="0" opacity="0">
<animateMotion dur="10s" begin="2.6s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1;1" keyTimes="0;0.1000;1" keySplines="0.45 0 0.25 1;0 0 1 1"><mpath href="#cs-request" xlink:href="#cs-request"/></animateMotion>
<animate attributeName="opacity" dur="10s" begin="2.6s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.1000;0.1001;1"/>
</circle>
